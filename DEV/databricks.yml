# This is a Databricks asset bundle definition for DEV.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DEV
  uuid: 1a2235dc-46dc-4405-bf9d-b3ae7865c913

include:
  - resources/*.yml
  - resources/*/*.yml

sync:
  include:
    - src/**

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-cb63415c-725c.cloud.databricks.com/
    variables:
      catalog: DEV
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-cb63415c-725c.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/kuntalb02@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kuntalb02@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: DEV
      schema: prod
    permissions:
      - user_name: kuntalb02@gmail.com
        level: CAN_MANAGE

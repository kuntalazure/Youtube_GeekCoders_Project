resources:
  jobs:
    ingestion_jobs:
      name: ingestion_jobs
      tasks:
        - task_key: Ingestion
          notebook_task:
            notebook_path: ../../src/notebooks/Ingestion.ipynb
            base_parameters:
              catalog_name: assetbundles
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
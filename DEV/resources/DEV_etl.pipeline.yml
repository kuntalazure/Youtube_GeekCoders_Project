# The main pipeline for DEV

resources:
  pipelines:
    DEV_etl:
      name: DEV_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/DEV_etl"

      libraries:
        - glob:
            include: ../src/DEV_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
